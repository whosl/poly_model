mode: shadow_no_trade
enable_trading: false

safety:
  disable_order_placement: true
  fail_if_order_api_configured: true

outputs:
  base_dir: /opt/pm-shadow/data/shadow
  report_dir: /opt/pm-shadow/reports/shadow
  flush_interval_seconds: 5

signal_queue:
  enabled: true
  path: /opt/pm-shadow/data/shadow/v5_signal_queue/signals.jsonl

model:
  type: terminal_binary
  model_path: /opt/pm-shadow/repo/models/pm_terminal/lightgbm.joblib
  features_path: /opt/pm-shadow/repo/models/pm_terminal/features_pm_terminal.json
  version: pm_terminal_v6_tail_chase_strict_shadow
  fee_rate: 0.07
  slippage_buffer: 0.01
  target_shares: 25.0

market_meta:
  silver_pm_path: /opt/pm-shadow/repo/configs/shadow_market_meta.parquet

feeds:
  binance:
    symbol: BTCUSDT
    streams:
      - bookTicker
      - aggTrade
    record_raw: true
    rest_fallback_enabled: true
    rest_fallback_stale_seconds: 15
    rest_fallback_poll_seconds: 5
    rest_fallback_timeout_seconds: 5

  polymarket:
    record_raw: true
    quote_ttl_seconds: 2.0
    websocket_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
    market_channel: "market"
    user_channel_enabled: false
    max_subscribed_markets: 12
    subscribe_batch_size: 20
    subscribe_lookback_seconds: 300
    subscribe_lookahead_seconds: 1800
    online_metadata_refresh_enabled: true
    online_metadata_refresh_seconds: 300
    metadata_refresh_lookback_minutes: 30
    metadata_refresh_lookahead_hours: 4
    quote_stale_reconnect_seconds: 120

binance:
  symbol: BTCUSDT
  ws_url: wss://stream.binance.com:443/stream?streams=btcusdt@bookTicker/btcusdt@aggTrade

polymarket:
  ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  subscribe_messages: []
  market_channel: "market"
  quote_ttl_seconds: 2.0
  user_channel_enabled: false

signals:
  configs:
    - name: v6_terminal_tail_chase_strict
      direction: BOTH
      # Net terminal edge thresholds after entry fee + slippage buffer.
      # Tail-chase: only the last 5-45s of each 15m market, with strict live
      # quote freshness, spread, pair overround and depth constraints.
      up_threshold: 0.05
      down_threshold: 0.05
      min_cost_adjusted_edge: 0.02
      max_spread: 0.08
      max_pair_ask_sum: 1.08
      min_time_to_expiry_seconds: 5
      max_time_to_expiry_seconds: 45
      max_quote_age_seconds: 2.0
      max_seconds_since_pm_update: 2.0
      order_size_shares: 25.0
      min_ask_depth_5: 100.0
      max_depth_fraction: 0.25
      cooldown_seconds: 900

simulation:
  entry_latencies_seconds: [0.0, 0.25, 0.5, 1.0, 2.0]
  exit_horizons_seconds: [-1]
  stress_costs: [0.0, 0.005, 0.01, 0.02]

candidate_logging:
  enabled: true
  min_prob: 0.0
  min_abs_edge: -999.0

live_data_collection:
  enabled: true
  sample_interval_seconds: 1.0

dry_run:
  historical_gold_path: /opt/pm-shadow/repo/configs/shadow_dryrun_gold_sample.parquet
  max_rows: 5000
  reset_cooldown_per_row: false
